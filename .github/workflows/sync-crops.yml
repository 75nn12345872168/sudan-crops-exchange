name: Daily Sudan Crops Sync

on:
  schedule:
    # Sudan Time is UTC+2:
    # 10:00 UTC = 12:00 PM (ظهراً بتوقيت السودان)
    # 14:00 UTC = 04:00 PM (عصراً بتوقيت السودان)
    - cron: "0 10,14 * * *"
  workflow_dispatch:

jobs:
  sync-gadarif-crops:
    name: Sync Gadarif Crop Prices to Supabase
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run crop price scraper & Supabase UPSERT
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python scripts/crop_sync.py
